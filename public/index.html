<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>-Nexus-messenger - Pro Search Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

</head>
<body class="h-screen flex items-center justify-center p-0 sm:p-4 overflow-hidden bg-slate-950 dark:bg-slate-950 bg-slate-100 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- نافذة تسجيل الدخول والتسجيل -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-cyan-500/30 p-6 sm:p-8 rounded-3xl w-full max-w-md text-center shadow-2xl">
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-500 to-blue-600 bg-clip-text text-transparent mb-2">-Nexus-</h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs mb-6">سجل دخولك أو أنشئ حساباً جديداً باسم فريد</p>
            
            <div class="space-y-3">
                <input type="text" id="authUsername" placeholder="اسم المستخدم" class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center text-sm focus:outline-none focus:border-cyan-500">
                <input type="password" id="authPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <p id="authError" class="text-rose-500 text-xs mt-3 hidden font-bold"></p>

            <div class="flex gap-3 mt-6">
                <button onclick="handleLogin()" class="flex-1 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-xl text-sm transition shadow-lg">تسجيل الدخول</button>
                <button onclick="handleRegister()" class="flex-1 py-3 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-cyan-600 dark:text-cyan-400 font-black rounded-xl text-sm transition">حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div class="w-full h-full sm:max-w-6xl sm:h-[92vh] sm:rounded-3xl overflow-hidden flex relative shadow-2xl border-0 sm:border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">
        
        <!-- القائمة الجانبية -->
        <div id="sidebarPanel" class="w-full md:w-80 bg-slate-50 dark:bg-slate-950 border-l border-slate-200 dark:border-slate-800 flex flex-col justify-between p-4 absolute md:relative inset-0 z-20 md:z-auto transition-all duration-300">
            <div>
                <div class="flex items-center justify-between mb-3 p-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                    <h2 class="font-black text-cyan-600 dark:text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-comments"></i> الدردشات</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="openSettings()" title="الإعدادات" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-gear text-xs"></i>
                        </button>
                        <span id="myUsername" class="text-xs bg-cyan-100 dark:bg-cyan-950 text-cyan-700 dark:text-cyan-300 px-3 py-1 rounded-full font-bold">...</span>
                    </div>
                </div>

                <!-- شريط البحث عن المستخدمين بالاسم -->
                <div class="mb-3">
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-search text-xs"></i>
                        </span>
                        <input type="text" id="userSearchInput" onkeyup="searchUsers(this.value)" placeholder="ابحث عن مستخدم بالاسم..." class="w-full pr-9 pl-3 py-2 bg-slate-100 dark:bg-slate-900 rounded-xl text-xs border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-cyan-500">
                    </div>
                </div>

                <div onclick="selectGlobalChat()" class="p-3 mb-3 rounded-2xl bg-cyan-50 dark:bg-cyan-950/60 hover:bg-cyan-100 dark:hover:bg-cyan-900/60 border border-cyan-500/30 cursor-pointer flex items-center justify-between transition">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🌍</span>
                        <span class="font-bold text-sm text-cyan-700 dark:text-cyan-300">الدردشة العامة (للجميع)</span>
                    </div>
                    <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                </div>

                <div id="usersList" class="space-y-2 overflow-y-auto max-h-[60vh] custom-scrollbar"></div>
            </div>
        </div>

        <!-- شاشة المحادثة -->
        <div id="chatPanel" class="w-full flex-1 flex flex-col bg-slate-50/50 dark:bg-slate-900/40 relative h-full">
            <div id="chatHeader" class="p-3 sm:p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-white/80 dark:bg-slate-950/60 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <button onclick="showSidebar()" class="md:hidden w-9 h-9 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-cyan-600 dark:text-cyan-400">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <div id="targetAvatar" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-lg">🌍</div>
                    <div>
                        <h3 id="targetUsername" class="font-bold text-slate-900 dark:text-white text-sm">الدردشة العامة (للجميع)</h3>
                        <p id="targetStatus" class="text-[10px] text-slate-500">محادثة مفتوحة للكل</p>
                    </div>
                </div>

                <div id="callButtons" class="hidden flex items-center gap-2">
                    <button onclick="startCall(false)" title="مكالمة صوتية" class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white transition flex items-center justify-center text-cyan-600 dark:text-cyan-400 shadow">
                        <i class="fa-solid fa-phone"></i>
                    </button>
                    <button onclick="startCall(true)" title="مكالمة فيديو" class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white transition flex items-center justify-center text-cyan-600 dark:text-cyan-400 shadow">
                        <i class="fa-solid fa-video"></i>
                    </button>
                </div>
            </div>

            <div id="messagesBox" class="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                <div class="text-center text-xs text-slate-400 my-auto pt-20">أهلاً بك في -Nexus-messenger، تحدث مع الجميع الآن! ⚡</div>
            </div>

            <!-- قائمة الإيموجيات -->
            <div id="emojiPicker" class="hidden absolute bottom-20 left-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-2xl shadow-2xl grid grid-cols-6 gap-2 z-30">
                <span onclick="insertEmoji('😀')" class="cursor-pointer text-xl hover:scale-125 transition">😀</span>
                <span onclick="insertEmoji('😂')" class="cursor-pointer text-xl hover:scale-125 transition">😂</span>
                <span onclick="insertEmoji('❤️')" class="cursor-pointer text-xl hover:scale-125 transition">❤️</span>
                <span onclick="insertEmoji('🔥')" class="cursor-pointer text-xl hover:scale-125 transition">🔥</span>
                <span onclick="insertEmoji('👍')" class="cursor-pointer text-xl hover:scale-125 transition">👍</span>
                <span onclick="insertEmoji('✨')" class="cursor-pointer text-xl hover:scale-125 transition">✨</span>
            </div>

            <!-- مكتبة الـ GIF المحلية -->
            <div id="gifPicker" class="hidden absolute bottom-20 left-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-2xl shadow-2xl flex flex-col z-35 w-72 h-80">
                <input type="text" id="gifSearchInput" onkeyup="filterGifs(this.value)" placeholder="ابحث في الـ GIFs..." class="w-full mb-2 px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs text-slate-900 dark:text-white focus:outline-none border border-slate-300 dark:border-slate-700">
                <div id="gifResults" class="flex-1 grid grid-cols-2 gap-2 overflow-y-auto custom-scrollbar"></div>
            </div>

            <!-- شريط الكتابة -->
            <div class="p-3 sm:p-4 border-t border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-950/60 backdrop-blur-md">
                <form onsubmit="sendMessage(event)" class="flex items-center gap-2 relative">
                    <button type="button" onclick="toggleEmojiPicker()" class="w-11 h-11 bg-slate-100 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white rounded-xl flex items-center justify-center text-cyan-600 dark:text-cyan-400 transition" title="إيموجي">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>

                    <button type="button" onclick="toggleGifPicker()" class="w-11 h-11 bg-slate-100 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white rounded-xl flex items-center justify-center text-cyan-600 dark:text-cyan-400 font-bold transition text-xs shadow" title="GIF">
                        GIF
                    </button>

                    <label for="fileInput" class="cursor-pointer w-11 h-11 bg-slate-100 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white rounded-xl flex items-center justify-center text-cyan-600 dark:text-cyan-400 transition" title="رفع ملف">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="fileInput" accept="image/*,video/*" class="hidden" onchange="previewAndSendFile(event)">

                    <button type="button" id="voiceRecordBtn" onclick="toggleVoiceRecording()" class="w-11 h-11 bg-slate-100 dark:bg-slate-800 hover:bg-rose-600 hover:text-white rounded-xl flex items-center justify-center text-cyan-600 dark:text-cyan-400 transition" title="تسجيل صوتي">
                        <i class="fa-solid fa-microphone text-lg"></i>
                    </button>

                    <input type="text" id="msgInput" placeholder="اكتب رسالتك..." class="flex-1 px-4 py-3 bg-slate-100 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-cyan-500">
                    <button type="submit" class="px-5 sm:px-6 py-3 bg-cyan-500 active:bg-cyan-400 text-slate-950 font-black rounded-xl text-sm transition shadow-lg">إرسال</button>
                </form>
            </div>

            <!-- شاشة المكالمات -->
            <div id="callOverlay" class="hidden absolute inset-0 bg-black/90 backdrop-blur-2xl z-50 flex flex-col items-center justify-between p-6">
                <div id="incomingCallAlert" class="hidden absolute top-10 bg-cyan-500 text-slate-950 font-black px-6 py-3 rounded-2xl shadow-2xl animate-bounce text-sm">
                    📞 مكالمة واردة جديدة... جاري الرنين
                </div>

                <div class="w-full flex-1 relative rounded-3xl overflow-hidden border border-white/10 flex items-center justify-center bg-neutral-900 shadow-2xl">
                    <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                    <video id="localVideo" autoplay playsinline muted class="absolute bottom-6 right-6 w-32 h-44 object-cover rounded-2xl border-2 border-white/20 shadow-2xl"></video>
                </div>
                
                <div class="my-6 flex items-center gap-6 bg-neutral-900/80 backdrop-blur-md px-8 py-4 rounded-full border border-white/10 shadow-2xl">
                    <button id="toggleMicBtn" onclick="toggleMicrophone()" class="w-14 h-14 rounded-full bg-neutral-800 hover:bg-neutral-700 text-white flex items-center justify-center transition shadow-md">
                        <i id="micIcon" class="fa-solid fa-microphone text-emerald-400 text-lg"></i>
                    </button>
                    <button onclick="endCall()" class="w-16 h-16 bg-rose-600 hover:bg-rose-500 rounded-full flex items-center justify-center text-white text-2xl shadow-xl shadow-rose-600/40">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>
                    <button id="toggleCamBtn" onclick="toggleCamera()" class="w-14 h-14 rounded-full bg-neutral-800 hover:bg-neutral-700 text-white flex items-center justify-center transition shadow-md">
                        <i id="camIcon" class="fa-solid fa-video text-emerald-400 text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl space-y-4">
            <h2 class="text-xl font-black text-slate-900 dark:text-white mb-2">إعدادات التطبيق ⚙️</h2>
            
            <div class="space-y-3 text-right">
                <div class="flex items-center justify-between p-3 bg-slate-100 dark:bg-slate-800 rounded-2xl">
                    <span class="text-sm font-bold text-slate-700 dark:text-slate-300">مظهر التطبيق:</span>
                    <button onclick="toggleTheme()" class="px-4 py-2 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-2 shadow">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                        <span id="themeText">الداكن</span>
                    </button>
                </div>
            </div>

            <button onclick="logout()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition shadow-md mt-4">تسجيل الخروج</button>
            <button onclick="closeSettings()" class="w-full py-2 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-xl text-xs">إغلاق</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = "", currentTarget = "الجميع", peerConnection, localStream;
        let isMicMuted = false, isCamOff = false;
        let chatStore = JSON.parse(localStorage.getItem('nexus_chats') || '{}');
        let allRegisteredUsers = []; // قائمة كل المستخدمين للبحث
        let mediaRecorder, audioChunks = [], isRecording = false;
        let ringtoneInterval = null;

        const masterGifList = [
            { url: "https://media.giphy.com/media/3o7TKSjRrfIPjeiOkM/giphy.gif", tags: "ضحك نكتة مضحك fun laugh" },
            { url: "https://media.giphy.com/media/l0HlP2ms0eEc5nlHG/giphy.gif", tags: "سعادة فرح happy dance" },
            { url: "https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif", tags: "حيرة تفكير think confused" },
            { url: "https://media.giphy.com/media/26u4lOMA8JKSnL9Uk/giphy.gif", tags: "ترحيب سلام hello welcome" },
            { url: "https://media.giphy.com/media/xTpxIuIH7QSWEtK83u/giphy.gif", tags: "تصفيق تسويق clap bravo" },
            { url: "https://media.giphy.com/media/5GoVL4DAbEDUQ/giphy.gif", tags: "حماس اكشن wow cool" },
            { url: "https://media.giphy.com/media/13HgwGsXF0aiGY/giphy.gif", tags: "قطط حيوانات cat cute" },
            { url: "https://media.giphy.com/media/XreQmk7ETCak0/giphy.gif", tags: "حزن زعل sad cry" },
            { url: "https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif", tags: "حب قلوب love heart" },
            { url: "https://media.giphy.com/media/l0MYEqEzwMWFCg8rm/giphy.gif", tags: "سيارات سرعة car fast" }
        ];

        function renderGifGrid(list) {
            const resultsBox = document.getElementById('gifResults');
            resultsBox.innerHTML = '';
            if (list.length === 0) {
                resultsBox.innerHTML = '<p class="text-[10px] text-slate-400 col-span-2 text-center pt-10">لا توجد نتائج</p>';
                return;
            }
            list.forEach(g => {
                resultsBox.innerHTML += `
                    <img src="${g.url}" onclick="sendGif('${g.url}')" class="w-full h-24 object-cover rounded-xl cursor-pointer hover:scale-105 transition shadow">
                `;
            });
        }

        function filterGifs(query) {
            const q = query.toLowerCase().trim();
            if (!q) { renderGifGrid(masterGifList); return; }
            renderGifGrid(masterGifList.filter(g => g.tags.includes(q)));
        }

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function playNativeRingtone() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                ringtoneInterval = setInterval(() => {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    if (navigator.vibrate) navigator.vibrate([300, 200, 300]);
                }, 1200);
            } catch (e) {}
        }

        function stopNativeRingtone() {
            if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
            if (navigator.vibrate) navigator.vibrate(0);
        }

        socket.on('connect', () => {
            const savedUser = localStorage.getItem('nexus_user');
            if (savedUser) {
                socket.emit('auto_login', { username: savedUser }, res => {
                    if (res.success) {
                        myName = res.username;
                        document.getElementById('myUsername').innerText = myName;
                        document.getElementById('authModal').classList.add('hidden');
                    } else {
                        localStorage.removeItem('nexus_user');
                    }
                });
            }
        });

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

        function toggleTheme() {
            const html = document.documentElement;
            const text = document.getElementById('themeText');
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                text.innerText = "الفاتح";
                icon.className = "fa-solid fa-sun";
            } else {
                html.classList.add('dark');
                text.innerText = "الداكن";
                icon.className = "fa-solid fa-moon";
            }
        }

        // عرض خطأ التسجيل بوضوح (مثل اسم المستخدم مستخدم مسبقاً)
        function showAuthError(msg) {
            const err = document.getElementById('authError');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        function handleRegister() {
            const u = document.getElementById('authUsername').value, p = document.getElementById('authPassword').value;
            if (!u || !p) { showAuthError("يرجى إدخال اسم المستخدم وكلمة المرور"); return; }
            socket.emit('register', { username: u, password: p, avatar: '⚡' }, res => {
                if (!res.success) {
                    showAuthError(res.msg); // يعرض الخطأ بوضوح إذا كان الاسم مأخوذاً
                } else {
                    showAuthError("");
                    document.getElementById('authError').classList.add('hidden');
                    alert(res.msg);
                }
            });
        }

        function handleLogin() {
            const u = document.getElementById('authUsername').value, p = document.getElementById('authPassword').value;
            if (!u || !p) { showAuthError("يرجى إدخال البيانات كاملة"); return; }
            socket.emit('login', { username: u, password: p }, res => {
                if (!res.success) {
                    showAuthError(res.msg);
                } else {
                    myName = res.username;
                    localStorage.setItem('nexus_user', myName);
                    document.getElementById('myUsername').innerText = myName;
                    document.getElementById('authModal').classList.add('hidden');
                }
            });
        }

        function logout() {
            localStorage.removeItem('nexus_user');
            location.reload();
        }

        function toggleEmojiPicker() {
            document.getElementById('gifPicker').classList.add('hidden');
            document.getElementById('emojiPicker').classList.toggle('hidden');
        }

        function toggleGifPicker() {
            document.getElementById('emojiPicker').classList.add('hidden');
            const picker = document.getElementById('gifPicker');
            picker.classList.toggle('hidden');
            if (!picker.classList.contains('hidden')) {
                renderGifGrid(masterGifList);
            }
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            document.getElementById('emojiPicker').classList.add('hidden');
            input.focus();
        }

        function sendGif(url) {
            socket.emit('send_message', { 
                to: currentTarget === "الجميع" ? null : currentTarget, 
                message: '', 
                file: url,
                fileType: 'gif'
            });
            document.getElementById('gifPicker').classList.add('hidden');
        }

        async function toggleVoiceRecording() {
            const btn = document.getElementById('voiceRecordBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            socket.emit('send_message', { 
                                to: currentTarget === "الجميع" ? null : currentTarget, 
                                message: '', 
                                file: reader.result,
                                fileType: 'audio'
                            });
                        };
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('bg-rose-600', 'text-white', 'animate-pulse');
                } catch (err) {
                    alert("تعذر الوصول للمايكروفون!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('bg-rose-600', 'text-white', 'animate-pulse');
            }
        }

        // استقبال قائمة المستخدمين وتخزينها للبحث
        socket.on('update_users_list', list => {
            allRegisteredUsers = list.filter(u => u.username !== myName);
            displayUsers(allRegisteredUsers);
        });

        // وظيفة البحث عن الناس بالاسم
        function searchUsers(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                displayUsers(allRegisteredUsers);
                return;
            }
            const filtered = allRegisteredUsers.filter(u => u.username.toLowerCase().includes(q));
            displayUsers(filtered);
        }

        function displayUsers(list) {
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center pt-4">لا يوجد مستخدمون بهذا الاسم</p>';
                return;
            }
            list.forEach(u => {
                const dotColor = u.isOnline ? 'bg-emerald-500' : 'bg-slate-400';
                container.innerHTML += `
                    <div onclick="selectUser('${u.username}', '${u.avatar}')" class="p-3 rounded-2xl bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800/80 cursor-pointer flex items-center justify-between transition shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">${u.avatar}</span>
                            <div>
                                <span class="font-bold text-sm text-slate-800 dark:text-slate-200 block">${u.username}</span>
                                <span class="text-[10px] text-slate-400">${u.isOnline ? 'متصل الآن' : 'غير متصل'}</span>
                            </div>
                        </div>
                        <span class="w-2.5 h-2.5 ${dotColor} rounded-full"></span>
                    </div>
                `;
            });
        }

        function selectGlobalChat() {
            currentTarget = "الجميع";
            document.getElementById('targetUsername').innerText = "الدردشة العامة (للجميع)";
            document.getElementById('targetAvatar').innerText = "🌍";
            document.getElementById('callButtons').classList.add('hidden');
            if (window.innerWidth < 768) document.getElementById('sidebarPanel').classList.add('hidden');
            renderMessages();
        }

        function selectUser(username, avatar) {
            currentTarget = username;
            document.getElementById('targetUsername').innerText = username;
            document.getElementById('targetAvatar').innerText = avatar;
            document.getElementById('callButtons').classList.remove('hidden');
            if (window.innerWidth < 768) document.getElementById('sidebarPanel').classList.add('hidden');
            renderMessages();
        }

        function showSidebar() { document.getElementById('sidebarPanel').classList.remove('hidden'); }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            if (input.value.trim()) {
                socket.emit('send_message', { to: currentTarget === "الجميع" ? null : currentTarget, message: input.value.trim() });
                input.value = '';
            }
        }

        function previewAndSendFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('send_message', { 
                    to: currentTarget === "الجميع" ? null : currentTarget, 
                    message: '', 
                    file: e.target.result,
                    fileType: isVideo ? 'video' : 'image'
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        socket.on('receive_message', data => {
            let key = currentTarget;
            if (data.to === "الجميع") key = "الجميع";
            else key = data.from === myName ? data.to : data.from;

            if (!chatStore[key]) chatStore[key] = [];
            chatStore[key].push(data);
            localStorage.setItem('nexus_chats', JSON.stringify(chatStore));

            if (key === currentTarget) renderMessages();
        });

        function renderMessages() {
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';
            const list = chatStore[currentTarget] || [];
            list.forEach(m => {
                const isMe = m.from === myName;
                let content = '';

                if (m.file) {
                    if (m.fileType === 'video') {
                        content = `<video src="${m.file}" controls class="rounded-xl max-w-full max-h-64"></video>`;
                    } else if (m.fileType === 'audio') {
                        content = `<audio src="${m.file}" controls class="w-full max-w-xs"></audio>`;
                    } else if (m.fileType === 'gif') {
                        content = `<img src="${m.file}" class="rounded-xl max-w-full max-h-60 object-cover shadow"/>`;
                    } else {
                        content = `<img src="${m.file}" class="rounded-xl max-w-full max-h-60 object-cover cursor-pointer shadow" onclick="window.open('${m.file}')"/>`;
                    }
                } else {
                    content = `<p class="text-sm leading-relaxed">${m.message}</p>`;
                }

                box.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] sm:max-w-[70%] p-3 rounded-2xl ${isMe ? 'bg-cyan-500 text-slate-950 font-semibold rounded-br-none shadow' : 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-200 rounded-bl-none border border-slate-300 dark:border-slate-700/50'}">
                            ${!isMe ? `<span class="text-[10px] text-cyan-600 dark:text-cyan-400 block font-bold mb-1">${m.from}</span>` : ''}
                            ${content}
                            <span class="text-[10px] opacity-60 block text-left mt-1">${m.timestamp}</span>
                        </div>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        }

        function toggleMicrophone() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    isMicMuted = !isMicMuted;
                    audioTrack.enabled = !isMicMuted;
                    document.getElementById('micIcon').className = isMicMuted ? "fa-solid fa-microphone-slash text-rose-500 text-lg" : "fa-solid fa-microphone text-emerald-400 text-lg";
                }
            }
        }

        function toggleCamera() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    isCamOff = !isCamOff;
                    videoTrack.enabled = !isCamOff;
                    document.getElementById('camIcon').className = isCamOff ? "fa-solid fa-video-slash text-rose-500 text-lg" : "fa-solid fa-video text-emerald-400 text-lg";
                }
            }
        }

        async function startCall(isVideo) {
            document.getElementById('callOverlay').classList.remove('hidden');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = e => {
                    document.getElementById('remoteVideo').srcObject = e.streams[0];
                };

                peerConnection.onicecandidate = e => {
                    if (e.candidate) socket.emit('ice_candidate', { to: currentTarget, candidate: e.candidate });
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call_user', { to: currentTarget, offer, isVideo });
            } catch (err) {
                alert("يرجى تفعيل صلاحيات الكاميرا والمايك!");
                endCall(false);
            }
        }

        socket.on('incoming_call', async ({ from, offer, isVideo }) => {
            playNativeRingtone();
            document.getElementById('incomingCallAlert').classList.remove('hidden');
            document.getElementById('incomingCallAlert').innerText = `📞 مكالمة واردة من ${from}...`;

            if (confirm(`مكالمة واردة من ${from}.. هل تريد الرد؟`)) {
                stopNativeRingtone();
                document.getElementById('incomingCallAlert').classList.add('hidden');
                currentTarget = from;
                document.getElementById('callOverlay').classList.remove('hidden');
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;

                    peerConnection = new RTCPeerConnection(rtcConfig);
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    peerConnection.ontrack = e => {
                        document.getElementById('remoteVideo').srcObject = e.streams[0];
                    };

                    peerConnection.onicecandidate = e => {
                        if (e.candidate) socket.emit('ice_candidate', { to: from, candidate: e.candidate });
                    };

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('answer_call', { to: from, answer });
                } catch (err) {
                    alert("تعذر فتح المايك أو الكاميرا!");
                    endCall(false);
                }
            } else {
                stopNativeRingtone();
                document.getElementById('incomingCallAlert').classList.add('hidden');
                socket.emit('end_call', { to: from });
            }
        });

        socket.on('call_answered', async ({ answer }) => {
            stopNativeRingtone();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice_candidate', async ({ candidate }) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        socket.on('call_ended', () => endCall(false));

        function endCall(notify = true) {
            stopNativeRingtone();
            if (notify && currentTarget !== "الجميع") socket.emit('end_call', { to: currentTarget });
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('callOverlay').classList.add('hidden');
            document.getElementById('incomingCallAlert').classList.add('hidden');
        }
    </script>
</body>
</html>
