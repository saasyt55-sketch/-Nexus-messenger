<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>-Nexus-messenger - الأسطوري الشامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 sm:p-4 overflow-hidden bg-slate-950 text-slate-100">

    <!-- نافذة تسجيل الدخول -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="bg-slate-900 border border-cyan-500/30 p-6 sm:p-8 rounded-3xl w-full max-w-md text-center shadow-2xl">
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">-Nexus-</h1>
            <p class="text-slate-400 text-xs mb-6">سجل دخولك واستمتع بالمحادثات والمكالمات الفورية</p>
            
            <div class="space-y-3">
                <input type="text" id="authUsername" placeholder="اسم المستخدم" class="w-full px-4 py-3 bg-slate-800 rounded-xl border border-slate-700 text-white text-center text-sm focus:outline-none focus:border-cyan-400">
                <input type="password" id="authPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 bg-slate-800 rounded-xl border border-slate-700 text-white text-center text-sm focus:outline-none focus:border-cyan-400">
            </div>

            <p id="authError" class="text-rose-400 text-xs mt-2 hidden"></p>

            <div class="flex gap-3 mt-6">
                <button onclick="handleLogin()" class="flex-1 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-xl text-sm transition">تسجيل الدخول</button>
                <button onclick="handleRegister()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-black rounded-xl text-sm transition">حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div class="w-full h-full sm:max-w-6xl sm:h-[92vh] sm:rounded-3xl overflow-hidden flex relative shadow-2xl border-0 sm:border border-slate-800 bg-slate-900 text-slate-100">
        
        <!-- القائمة الجانبية -->
        <div id="sidebarPanel" class="w-full md:w-80 bg-slate-950 border-l border-slate-800 flex flex-col justify-between p-4 absolute md:relative inset-0 z-20 md:z-auto transition-all duration-300">
            <div>
                <div class="flex items-center justify-between mb-4 p-2 border-b border-slate-800 pb-3">
                    <div class="flex items-center gap-2">
                        <h2 class="font-black text-cyan-400">المحادثات</h2>
                        <!-- زر الإضافة (+) -->
                        <button onclick="openActionMenu()" title="إضافة دردشة أو مجموعة" class="w-8 h-8 rounded-full bg-cyan-500 text-slate-950 font-bold flex items-center justify-center hover:bg-cyan-400 transition shadow-lg">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="logout()" title="خروج" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-rose-600 hover:text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-right-from-bracket text-xs"></i>
                        </button>
                        <span id="myUsername" class="text-xs bg-cyan-950 text-cyan-300 px-3 py-1 rounded-full font-bold">...</span>
                    </div>
                </div>
                <div id="usersList" class="space-y-2 overflow-y-auto max-h-[78vh] custom-scrollbar"></div>
            </div>
        </div>

        <!-- شاشة المحادثة -->
        <div id="chatPanel" class="w-full flex-1 flex flex-col bg-slate-900/40 relative h-full">
            <div id="chatHeader" class="p-3 sm:p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
                <div class="flex items-center gap-3">
                    <button onclick="showSidebar()" class="md:hidden w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <div id="targetAvatar" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-lg">💬</div>
                    <div>
                        <h3 id="targetUsername" class="font-bold text-white text-sm">اختر مستخدماً</h3>
                        <p id="targetStatus" class="text-[10px] text-slate-500">محادثة مشفرة</p>
                    </div>
                </div>

                <div id="callButtons" class="hidden flex items-center gap-2">
                    <button onclick="startCall(false)" title="مكالمة صوتية" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 transition flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-phone"></i>
                    </button>
                    <button onclick="startCall(true)" title="مكالمة فيديو" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 transition flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-video"></i>
                    </button>
                </div>
            </div>

            <div id="messagesBox" class="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                <div class="text-center text-xs text-slate-500 my-auto pt-20">اختر صديقاً أو أنشئ مجموعة من زر (+) ⚡</div>
            </div>

            <div class="p-3 sm:p-4 border-t border-slate-800 bg-slate-950/60">
                <form onsubmit="sendPrivateMessage(event)" class="flex items-center gap-2">
                    <label for="fileInput" class="cursor-pointer w-11 h-11 bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 rounded-xl flex items-center justify-center text-cyan-400 transition">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="fileInput" accept="image/*,video/*" class="hidden" onchange="previewAndSendFile(event)">

                    <input type="text" id="msgInput" placeholder="اكتب رسالتك..." class="flex-1 px-4 py-3 bg-slate-900 rounded-xl border border-slate-800 text-white text-sm focus:outline-none focus:border-cyan-500">
                    <button type="submit" class="px-5 sm:px-6 py-3 bg-cyan-500 active:bg-cyan-400 text-slate-950 font-black rounded-xl text-sm transition">إرسال</button>
                </form>
            </div>

            <!-- شاشة المكالمات -->
            <div id="callOverlay" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col items-center justify-between p-4 sm:p-6">
                <div class="w-full flex-1 relative bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                    <video id="localVideo" autoplay playsinline muted class="absolute bottom-4 right-4 w-28 h-36 sm:w-36 sm:h-28 object-cover rounded-2xl border-2 border-slate-700 shadow-2xl"></video>
                </div>
                
                <div class="my-4 flex items-center gap-4 bg-slate-900 px-6 py-3 rounded-2xl border border-slate-800">
                    <button id="toggleMicBtn" onclick="toggleMicrophone()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition">
                        <i id="micIcon" class="fa-solid fa-microphone text-emerald-400"></i>
                    </button>
                    <button onclick="endCall()" class="w-14 h-14 bg-rose-600 hover:bg-rose-500 rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-rose-600/40">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>
                    <button id="toggleCamBtn" onclick="toggleCamera()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition">
                        <i id="camIcon" class="fa-solid fa-video text-emerald-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة منيو زر (+) (إنشاء مجموعة أو دردشة جديدة) -->
    <div id="actionModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl space-y-4">
            <h2 class="text-xl font-black text-white">خيارات جديدة ✨</h2>
            <button onclick="openNewChatModal()" class="w-full py-3 bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-cyan-400 font-bold rounded-xl transition text-sm">
                <i class="fa-solid fa-comment-dots ml-2"></i> إنشاء دردشة جديدة
            </button>
            <button onclick="openCreateGroupModal()" class="w-full py-3 bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-cyan-400 font-bold rounded-xl transition text-sm">
                <i class="fa-solid fa-users-rectangle ml-2"></i> إنشاء مجموعة جديدة
            </button>
            <button onclick="closeActionMenu()" class="w-full py-2 bg-slate-950 text-slate-400 hover:text-white text-xs rounded-xl">إلغاء</button>
        </div>
    </div>

    <!-- نافذة إنشاء مجموعة -->
    <div id="groupModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl space-y-4">
            <h2 class="text-xl font-black text-white">إنشاء مجموعة 👥</h2>
            <input type="text" id="groupNameInput" placeholder="اسم المجموعة" class="w-full px-4 py-3 bg-slate-800 rounded-xl border border-slate-700 text-white text-center text-sm focus:outline-none focus:border-cyan-400">
            <div class="flex gap-2">
                <button onclick="createGroupSubmit()" class="flex-1 py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl text-sm">إنشاء</button>
                <button onclick="closeGroupModal()" class="flex-1 py-3 bg-slate-800 text-slate-400 rounded-xl text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = "", currentTarget = "", peerConnection, localStream;
        let isMicMuted = false, isCamOff = false;
        let chatStore = JSON.parse(localStorage.getItem('nexus_chats') || '{}');

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // طلب إذن الإشعارات عند الدخول
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        socket.on('connect', () => {
            const savedUser = localStorage.getItem('nexus_user');
            if (savedUser) {
                socket.emit('auto_login', { username: savedUser }, res => {
                    if (res.success) {
                        myName = res.username;
                        document.getElementById('myUsername').innerText = myName;
                        document.getElementById('authModal').classList.add('hidden');
                    } else {
                        localStorage.removeItem('nexus_user');
                    }
                });
            }
        });

        function openActionMenu() { document.getElementById('actionModal').classList.remove('hidden'); }
        function closeActionMenu() { document.getElementById('actionModal').classList.add('hidden'); }
        
        function openNewChatModal() {
            closeActionMenu();
            alert("اختر الشخص مباشرة من القائمة الجانبية للمحادثة!");
        }

        function openCreateGroupModal() {
            closeActionMenu();
            document.getElementById('groupModal').classList.remove('hidden');
        }
        function closeGroupModal() { document.getElementById('groupModal').classList.add('hidden'); }

        function createGroupSubmit() {
            const gName = document.getElementById('groupNameInput').value.trim();
            if (gName) {
                socket.emit('create_group', { groupName: gName, members: [] });
                document.getElementById('groupNameInput').value = '';
                closeGroupModal();
            }
        }

        function handleRegister() {
            const u = document.getElementById('authUsername').value, p = document.getElementById('authPassword').value;
            socket.emit('register', { username: u, password: p, avatar: '⚡' }, res => {
                if (!res.success) showError(res.msg);
                else alert(res.msg);
            });
        }

        function handleLogin() {
            const u = document.getElementById('authUsername').value, p = document.getElementById('authPassword').value;
            socket.emit('login', { username: u, password: p }, res => {
                if (!res.success) showError(res.msg);
                else {
                    myName = res.username;
                    localStorage.setItem('nexus_user', myName);
                    document.getElementById('myUsername').innerText = myName;
                    document.getElementById('authModal').classList.add('hidden');
                }
            });
        }

        function logout() {
            localStorage.removeItem('nexus_user');
            location.reload();
        }

        socket.on('update_users_list', list => {
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            list.filter(u => u.username !== myName).forEach(u => {
                const dotColor = u.isOnline ? 'bg-emerald-500' : 'bg-slate-600';
                container.innerHTML += `
                    <div onclick="selectUser('${u.username}', '${u.avatar}')" class="p-3 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800/80 cursor-pointer flex items-center justify-between transition">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">${u.avatar}</span>
                            <span class="font-bold text-sm text-slate-200">${u.username}</span>
                        </div>
                        <span class="w-2.5 h-2.5 ${dotColor} rounded-full"></span>
                    </div>
                `;
            });
        });

        socket.on('group_created', group => {
            const container = document.getElementById('usersList');
            container.innerHTML += `
                <div onclick="selectUser('${group.name}', '👥')" class="p-3 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800/80 cursor-pointer flex items-center justify-between transition">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">👥</span>
                        <span class="font-bold text-sm text-cyan-400">${group.name} (مجموعة)</span>
                    </div>
                </div>
            `;
        });

        function selectUser(username, avatar) {
            currentTarget = username;
            document.getElementById('targetUsername').innerText = username;
            document.getElementById('targetAvatar').innerText = avatar;
            document.getElementById('callButtons').classList.remove('hidden');

            if (window.innerWidth < 768) {
                document.getElementById('sidebarPanel').classList.add('hidden');
            }
            renderMessages();
        }

        function showSidebar() {
            document.getElementById('sidebarPanel').classList.remove('hidden');
        }

        function sendPrivateMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            if (input.value.trim() && currentTarget) {
                socket.emit('send_private_msg', { to: currentTarget, message: input.value.trim() });
                input.value = '';
            }
        }

        function previewAndSendFile(event) {
            const file = event.target.files[0];
            if (!file || !currentTarget) return;

            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('send_private_msg', { 
                    to: currentTarget, 
                    message: '', 
                    file: e.target.result,
                    fileType: isVideo ? 'video' : 'image'
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        socket.on('receive_private_msg', data => {
            const partner = data.from === myName ? data.to : data.from;
            if (!chatStore[partner]) chatStore[partner] = [];
            chatStore[partner].push(data);
            localStorage.setItem('nexus_chats', JSON.stringify(chatStore));

            if (partner === currentTarget) {
                renderMessages();
            } else if (data.from !== myName) {
                // إظهار إشعار سطح المكتب أو المتصفح عند وصول رسالة وأنت خارج المحادثة
                if (Notification.permission === "granted") {
                    new Notification(`رسالة جديدة من ${data.from}`, { body: data.message || "أرسل ملفاً" });
                }
            }
        });

        function renderMessages() {
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';
            const list = chatStore[currentTarget] || [];
            list.forEach(m => {
                const isMe = m.from === myName;
                let content = m.file ? (m.fileType === 'video' ? `<video src="${m.file}" controls class="rounded-xl max-w-full max-h-64"></video>` : `<img src="${m.file}" class="rounded-xl max-w-full max-h-60 object-cover cursor-pointer" onclick="window.open('${m.file}')"/>`) : `<p class="text-sm leading-relaxed">${m.message}</p>`;

                box.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] sm:max-w-[70%] p-3 rounded-2xl ${isMe ? 'bg-cyan-500 text-slate-950 font-semibold rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700/50'}">
                            ${!isMe ? `<span class="text-[10px] text-cyan-400 block font-bold mb-1">${m.from}</span>` : ''}
                            ${content}
                            <span class="text-[10px] opacity-60 block text-left mt-1">${m.timestamp}</span>
                        </div>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        }

        function toggleMicrophone() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    isMicMuted = !isMicMuted;
                    audioTrack.enabled = !isMicMuted;
                    document.getElementById('micIcon').className = isMicMuted ? "fa-solid fa-microphone-slash text-rose-500" : "fa-solid fa-microphone text-emerald-400";
                }
            }
        }

        function toggleCamera() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    isCamOff = !isCamOff;
                    videoTrack.enabled = !isCamOff;
                    document.getElementById('camIcon').className = isCamOff ? "fa-solid fa-video-slash text-rose-500" : "fa-solid fa-video text-emerald-400";
                }
            }
        }

        async function startCall(isVideo) {
            document.getElementById('callOverlay').classList.remove('hidden');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = e => {
                    document.getElementById('remoteVideo').srcObject = e.streams[0];
                };

                peerConnection.onicecandidate = e => {
                    if (e.candidate) socket.emit('ice_candidate', { to: currentTarget, candidate: e.candidate });
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call_user', { to: currentTarget, offer, isVideo });
            } catch (err) {
                alert("يرجى تفعيل صلاحيات الكاميرا والمايك!");
                endCall(false);
            }
        }

        socket.on('incoming_call', async ({ from, offer, isVideo }) => {
            if (confirm(`مكالمة واردة من ${from}.. هل تريد الرد؟`)) {
                currentTarget = from;
                document.getElementById('callOverlay').classList.remove('hidden');
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;

                    peerConnection = new RTCPeerConnection(rtcConfig);
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    peerConnection.ontrack = e => {
                        document.getElementById('remoteVideo').srcObject = e.streams[0];
                    };

                    peerConnection.onicecandidate = e => {
                        if (e.candidate) socket.emit('ice_candidate', { to: from, candidate: e.candidate });
                    };

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('answer_call', { to: from, answer });
                } catch (err) {
                    alert("تعذر فتح المايك أو الكاميرا للرد!");
                    endCall(false);
                }
            }
        });

        socket.on('call_answered', async ({ answer }) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice_candidate', async ({ candidate }) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        socket.on('call_ended', () => endCall(false));

        function endCall(notify = true) {
            if (notify && currentTarget) socket.emit('end_call', { to: currentTarget });
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('callOverlay').classList.add('hidden');
        }
    </script>
</body>
</html>
