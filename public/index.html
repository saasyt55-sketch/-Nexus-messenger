<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - شات فخم وأسطوري</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2 sm:p-4 text-slate-100 overflow-hidden">

    <!-- شاشة الدخول -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="glass p-8 rounded-3xl w-full max-w-md mx-4 text-center border border-cyan-500/30 neon-border">
            <div class="w-20 h-20 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-4xl shadow-lg shadow-cyan-500/50 animate-pulse">
                ⚡
            </div>
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent mb-2">NexusChat</h1>
            <p class="text-slate-400 text-sm mb-6">مرحباً بك في عالم المحادثات المستقبلية الفخمة</p>
            
            <input type="text" id="usernameInput" placeholder="أدخل اسمك الأسطوري..." class="w-full px-4 py-3 bg-slate-900/80 rounded-xl border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 mb-4 text-center font-bold">
            
            <button onclick="joinChat()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black rounded-xl transition shadow-lg shadow-cyan-500/30 flex items-center justify-center gap-2">
                <span>دخول الشات</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- الواجهة الرئيسية للتطبيق -->
    <div class="glass w-full h-full max-w-6xl rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-2xl border border-slate-800">
        
        <!-- القائمة الجانبية (الغرف والأعضاء) -->
        <div class="w-full md:w-80 bg-slate-950/60 border-b md:border-b-0 md:border-l border-slate-800 p-4 flex flex-col justify-between">
            <div>
                <!-- الشعار -->
                <div class="flex items-center gap-3 mb-6 p-2">
                    <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center text-xl font-black text-slate-950 shadow-md shadow-cyan-500/50">
                        N
                    </div>
                    <div>
                        <h2 class="font-black text-lg text-white">NEXUS VIP</h2>
                        <p class="text-xs text-cyan-400 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> متصل بالسيرفر
                        </p>
                    </div>
                </div>

                <!-- قائمة القنوات -->
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-2">القنوات العامة</p>
                    <button onclick="switchRoom('general')" class="w-full flex items-center justify-between p-3 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-bold transition">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-hashtag"></i> الرئيسية</span>
                        <span id="onlineCount" class="text-xs bg-cyan-950 px-2 py-0.5 rounded-full text-cyan-300">1</span>
                    </button>
                    <button onclick="switchRoom('tech')" class="w-full flex items-center justify-between p-3 rounded-xl hover:bg-slate-900/50 text-slate-400 font-bold transition">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-code"></i> تقنية وذكاء اصطناعي</span>
                    </button>
                </div>
            </div>

            <!-- معلومات الملف الشخصي -->
            <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between px-2">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-xl">
                        😎
                    </div>
                    <div>
                        <p id="currentUserDisplay" class="font-bold text-sm text-white">زائر</p>
                        <p class="text-xs text-slate-400">عضو مميز</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- منطقة المحادثة الرئيسي -->
        <div class="flex-1 flex flex-col justify-between h-full bg-slate-900/30">
            
            <!-- الهيدر -->
            <div class="p-4 border-b border-slate-800/80 flex items-center justify-between bg-slate-950/40">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-hashtag text-cyan-400 text-xl"></i>
                    <div>
                        <h3 id="currentRoomTitle" class="font-bold text-white">الرئيسية</h3>
                        <p class="text-xs text-slate-400">محادثات فورية عالية السرعة</p>
                    </div>
                </div>
            </div>

            <!-- شاشة الرسائل -->
            <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar">
                <div class="text-center my-4">
                    <span class="text-xs bg-slate-800/60 text-slate-400 px-3 py-1 rounded-full border border-slate-700">بداية تشفير المحادثة الأسطورية 🔒</span>
                </div>
            </div>

            <!-- صندوق الإدخال -->
            <div class="p-4 border-t border-slate-800/80 bg-slate-950/40">
                <form id="chatForm" onsubmit="sendMessage(event)" class="flex gap-2">
                    <input type="text" id="messageInput" placeholder="اكتب رسالتك الفخمة هنا..." class="flex-1 px-4 py-3 bg-slate-900/80 rounded-xl border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition" autocomplete="off">
                    <button type="submit" class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-xl transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
                        <span>إرسال</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- الكود البرمجي للتفاعل -->
    <script>
        const socket = io();
        let currentUsername = "";
        let currentRoom = "general";

        function joinChat() {
            const input = document.getElementById('usernameInput');
            if (input.value.trim() !== '') {
                currentUsername = input.value.trim();
                document.getElementById('currentUserDisplay').innerText = currentUsername;
                document.getElementById('loginModal').classList.add('hidden');
                
                // الانضمام للسيرفر
                socket.emit('join_room', { username: currentUsername, room: currentRoom });
            }
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            if (input.value.trim() !== '') {
                socket.emit('send_message', { message: input.value });
                input.value = '';
            }
        }

        function switchRoom(roomName) {
            currentRoom = roomName;
            document.getElementById('currentRoomTitle').innerText = roomName === 'general' ? 'الرئيسية' : 'تقنية وذكاء اصطناعي';
            document.getElementById('messagesContainer').innerHTML = '';
            socket.emit('join_room', { username: currentUsername, room: currentRoom });
        }

        // استقبال الرسائل
        socket.on('receive_message', (data) => {
            const container = document.getElementById('messagesContainer');
            const isMe = data.username === currentUsername;

            const msgHtml = `
                <div class="flex items-start gap-3 ${isMe ? 'flex-row-reverse' : ''}">
                    <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-sm flex-shrink-0">
                        ${data.avatar}
                    </div>
                    <div class="max-w-[70%]">
                        <div class="flex items-center gap-2 mb-1 ${isMe ? 'justify-end' : ''}">
                            <span class="text-xs font-bold ${isMe ? 'text-cyan-400' : 'text-purple-400'}">${data.username}</span>
                            <span class="text-[10px] text-slate-500">${data.timestamp}</span>
                        </div>
                        <div class="p-3 rounded-2xl ${isMe ? 'bg-cyan-600 text-white rounded-tl-none' : 'bg-slate-800 text-slate-200 rounded-tr-none border border-slate-700/50'}">
                            <p class="text-sm leading-relaxed break-words">${data.message}</p>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += msgHtml;
            container.scrollTop = container.scrollHeight;
        });

        // رسائل النظام
        socket.on('system_message', (data) => {
            const container = document.getElementById('messagesContainer');
            container.innerHTML += `
                <div class="text-center my-2">
                    <span class="text-xs text-slate-400 bg-slate-900/40 px-3 py-1 rounded-full border border-slate-800">${data.text}</span>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        });

        // تحديث الأعضاء
        socket.on('room_stats', (data) => {
            document.getElementById('onlineCount').innerText = data.onlineCount;
        });
    </script>
</body>
</html>
