<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>-Nexus-messenger VIP Pro</title>

    <!-- 📱 إعدادات أيقونة الشاشة الرئيسية للآيفون والـ PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-10-30-b138def7-8ffd-4d03-ad72-92deeb35ed72.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://cdn.phototourl.com/member/2026-10-30-b138def7-8ffd-4d03-ad72-92deeb35ed72.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.phototourl.com/member/2026-10-30-b138def7-8ffd-4d03-ad72-92deeb35ed72.png">
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-10-30-b138def7-8ffd-4d03-ad72-92deeb35ed72.png">

    <!-- 🚀 جعل التطبيق يعمل بشاشة كاملة مثل التطبيقات الحقيقية -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="-Nexus-">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .mobile-slide-enter { animation: slideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideIn { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .filter-smooth { filter: contrast(105%) brightness(108%) saturate(110%); }
        .filter-warm { filter: sepia(25%) saturate(130%) brightness(102%); }
        .filter-cyber { filter: hue-rotate(180deg) saturate(140%); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 sm:p-4 overflow-hidden bg-slate-950 dark:bg-slate-950 bg-slate-100 text-slate-900 dark:text-slate-100">

    <!-- نافذة التسجيل والدخول مع رمز التحقق 3 أرقام -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 mobile-slide-enter">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-cyan-500/30 p-6 sm:p-8 rounded-3xl w-full max-w-md text-center shadow-2xl">
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-500 to-blue-600 bg-clip-text text-transparent mb-1">-Nexus-</h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs mb-6">سجل ببريدك الموثق مع رمز تحقق مكوّن من 3 أرقام</p>
            
            <div id="authFields" class="space-y-3">
                <input type="email" id="authEmail" placeholder="البريد الإلكتروني الحقيقي (Email)" class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center text-sm focus:outline-none focus:border-cyan-500">
                <input type="text" id="authUsername" placeholder="اسم المستخدم (Username فريد)" class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center text-sm focus:outline-none focus:border-cyan-500">
                <input type="password" id="authPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center text-sm focus:outline-none focus:border-cyan-500">
                
                <div id="codeSection" class="hidden pt-2">
                    <div class="bg-cyan-500/10 border border-cyan-500/30 p-3 rounded-2xl mb-2">
                        <p id="codeNotice" class="text-xs text-cyan-400 font-bold mb-1"></p>
                    </div>
                    <input type="text" id="authCode" maxlength="3" placeholder="أدخل الرمز المكون من 3 أرقام" class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border-2 border-cyan-500 text-cyan-400 font-black tracking-widest text-center text-lg focus:outline-none">
                </div>
            </div>

            <p id="authError" class="text-rose-500 text-xs mt-3 hidden font-bold"></p>

            <div class="flex gap-3 mt-6">
                <button type="button" onclick="handleLogin()" class="flex-1 py-3 bg-cyan-500 active:scale-95 text-slate-950 font-black rounded-xl text-sm transition shadow-lg">تسجيل الدخول</button>
                <button type="button" id="regBtn" onclick="handleRegisterProcess()" class="flex-1 py-3 bg-slate-200 dark:bg-slate-800 active:scale-95 text-cyan-600 dark:text-cyan-400 font-black rounded-xl text-sm transition">حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div class="w-full h-full sm:max-w-6xl sm:h-[92vh] sm:rounded-3xl overflow-hidden flex relative shadow-2xl border-0 sm:border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">
        
        <!-- القائمة الجانبية -->
        <div id="sidebarPanel" class="w-full md:w-80 bg-slate-50 dark:bg-slate-950 border-l border-slate-200 dark:border-slate-800 flex flex-col justify-between p-4 absolute md:relative inset-0 z-20 md:z-auto transition-all duration-300 mobile-slide-enter">
            <div>
                <div class="flex items-center justify-between mb-4 p-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                    <div class="flex items-center gap-2">
                        <h2 class="font-black text-cyan-600 dark:text-cyan-400">الدردشات</h2>
                        <button type="button" onclick="openPlusMenu()" title="إضافة صديق أو مجموعة" class="w-8 h-8 rounded-full bg-cyan-500 text-slate-950 font-black flex items-center justify-center active:scale-90 transition shadow-lg">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="openSettings()" title="الإعدادات" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-gear text-xs"></i>
                        </button>
                        <span id="myUsername" class="text-xs bg-cyan-100 dark:bg-cyan-950 text-cyan-700 dark:text-cyan-300 px-3 py-1 rounded-full font-bold">...</span>
                    </div>
                </div>

                <div id="myContactsList" class="space-y-2 overflow-y-auto max-h-[72vh] custom-scrollbar">
                    <p class="text-xs text-slate-400 text-center pt-10">لا يوجد أصدقاء بعد.<br>اضغط على زر (+) لإرسال طلبات صداقة!</p>
                </div>
            </div>
        </div>

        <!-- شاشة المحادثة -->
        <div id="chatPanel" class="w-full flex-1 flex flex-col bg-slate-50/50 dark:bg-slate-900/40 relative h-full">
            <div id="chat
